{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1A303D">
    <title>{% block title %}Survey tool{% endblock %} | Avonmoor Rainwater Harvesting</title>
    <link rel="stylesheet" href="{% static 'css/water_survey.css' %}">
</head>
<body class="survey-app">
    <header class="app-header">
        <a href="{% url 'water_survey:survey-list' %}" class="brand" aria-label="Avonmoor Rainwater Harvesting survey workspace">
            <span class="brand-logo" aria-hidden="true">
                <img class="brand-master" src="{% static 'img/avonmoor-master-horizontal-dark.svg' %}" alt="">
            </span>
            <strong class="brand-workspace">Survey Workspace</strong>
        </a>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="text-button">Sign out</button>
        </form>
    </header>
    <main class="app-main">
        {% if messages %}
        <div class="message-list" aria-live="polite">
            {% for message in messages %}
            <div class="message message-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
